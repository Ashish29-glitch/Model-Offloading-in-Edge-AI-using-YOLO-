<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeVision AI | YOLOv5 Object Detection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #10b981;
            --secondary-dark: #059669;
            --dark: #0f111a;
            --darker: #090a10;
            --light: #f9fafb;
            --lighter: #ffffff;
            --gray: #9ca3af;
            --gray-light: #d1d5db;
            --accent: #8b5cf6;
            --gold: #d4af37;
            --platinum: #e5e7eb;
            --card-bg: rgba(20, 22, 30, 0.92);
            --card-border: rgba(255, 255, 255, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --neon-glow: 0 0 10px rgba(99, 102, 241, 0.6),
                          0 0 20px rgba(99, 102, 241, 0.4),
                          0 0 30px rgba(99, 102, 241, 0.2);
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 25px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 25%);
            z-index: -1;
        }

        /* Premium animated background */
        .premium-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .premium-bg::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(79, 70, 229, 0.05) 0%, transparent 15%),
                radial-gradient(circle at 70% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 15%),
                radial-gradient(circle at 40% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 15%);
            animation: rotateSlow 60s linear infinite;
        }

        @keyframes rotateSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .floating-element {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            opacity: 0.1;
            filter: blur(40px);
            animation: float 15s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            left: 80%;
            animation-delay: -5s;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
        }

        .floating-element:nth-child(3) {
            width: 250px;
            height: 250px;
            top: 70%;
            left: 15%;
            animation-delay: -10s;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
            padding-top: 1.5rem;
            position: relative;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: var(--neon-glow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .logo-icon::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0.3),
                rgba(255, 255, 255, 0.1)
            );
            transform: rotate(30deg);
            z-index: 1;
        }

        .logo:hover .logo-icon {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.8),
                        0 0 40px rgba(99, 102, 241, 0.5),
                        0 0 60px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 3.2rem;
            background: linear-gradient(135deg, var(--platinum) 0%, var(--primary-light) 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
            position: relative;
            display: inline-block;
            text-shadow: 0 2px 10px rgba(99, 102, 241, 0.2);
        }

        h1::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.7;
        }

        .subtitle {
            color: var(--gray-light);
            font-weight: 400;
            font-size: 1.2rem;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
            opacity: 0.8;
        }

        .card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 80%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .card:hover::after {
            opacity: 1;
        }

        .option-buttons {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2.5rem 0;
        }

        .btn {
            padding: 1.2rem 2.4rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border: none;
            position: relative;
            overflow: hidden;
            z-index: 1;
            letter-spacing: 0.5px;
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(79, 70, 229, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.08) 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.12) 100%);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(239, 68, 68, 0.6);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--lighter);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 1rem;
            letter-spacing: 0.5px;
        }

        .section-title i {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
        }

        .camera-container, #uploadSection {
            margin-top: 2rem;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #video {
            width: 100%;
            max-width: 720px;
            border-radius: 20px;
            overflow: hidden;
            margin: 0 auto;
            display: block;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: perspective(1000px) rotateX(5deg);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        #video:hover {
            transform: perspective(1000px) rotateX(0);
            box-shadow: var(--shadow-xl);
        }

        .camera-controls {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2.5rem;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 3.5rem;
            text-align: center;
            transition: all 0.4s ease;
            cursor: pointer;
            margin-bottom: 2rem;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .upload-area::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.05)
            );
            transform: rotate(30deg);
            z-index: 0;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: var(--shadow-md);
            transform: translateY(-5px);
        }

        .upload-area.active {
            border-color: var(--secondary);
            background: rgba(16, 185, 129, 0.12);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            position: relative;
            z-index: 1;
            transition: transform 0.4s ease;
        }

        .upload-area:hover .upload-icon {
            transform: scale(1.15) translateY(-8px);
        }

        .upload-text {
            color: var(--gray-light);
            margin-bottom: 2rem;
            font-size: 1.2rem;
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
        }

        .file-input {
            display: none;
        }

        #result {
            margin-top: 3rem;
        }

        .result-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            margin-top: 2.5rem;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--card-border);
            position: relative;
            animation: fadeInUp 0.6s ease-out;
        }

        .result-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--secondary), var(--primary), var(--accent));
            opacity: 0.8;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .result-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .image-container {
            margin: 3rem 0;
            text-align: center;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .image-container:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-xl);
        }

        .image-container img {
            max-width: 100%;
            display: block;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .metric-card {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.2) 100%);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
        }

        .metric-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-md);
        }

        .metric-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 1rem 0;
            color: var(--secondary);
            letter-spacing: 0.5px;
        }

        .metric-label {
            color: var(--gray-light);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .detections {
            margin-top: 3rem;
        }

        .detection-item {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.2) 100%);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .detection-item::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--secondary), var(--primary));
            opacity: 0.8;
        }

        .detection-item:hover {
            transform: translateX(8px);
            box-shadow: var(--shadow-sm);
        }

        .detection-name {
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: 0.3px;
        }

        .detection-confidence {
            color: var(--secondary);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.3px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5rem 2rem;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary);
            border-right: 4px solid var(--accent);
            border-bottom: 4px solid var(--secondary);
            animation: spin 1.5s linear infinite;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .spinner::after {
            content: "";
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 2px solid var(--primary-light);
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            margin-top: 5rem;
            padding: 3rem 0;
            color: var(--gray-light);
            font-size: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            letter-spacing: 0.5px;
        }

        footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .file-name {
            margin-top: 1.5rem;
            color: var(--secondary);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        /* Premium enhancements */
        .premium-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: 2.5rem 0;
        }

        @media (max-width: 768px) {
            .option-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .camera-controls {
                flex-direction: column;
            }

            .card {
                padding: 2rem;
            }

            h1 {
                font-size: 2.5rem;
            }
            
            .upload-area {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>
    <!-- Premium animated background -->
    <div class="premium-bg">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-microchip"></i>
                </div>
                <h1>EdgeVision AI</h1>
            </div>
            <p class="subtitle">Advanced YOLOv5 object detection with performance offloading between mobile and edge devices</p>
        </header>

        <main>
            <div class="card">
                <h2 class="section-title"><i class="fas fa-cog"></i> Detection Method</h2>
                <div class="option-buttons">
                    <button id="showCamera" class="btn btn-primary pulse">
                        <i class="fas fa-camera"></i> Use Camera
                    </button>
                    <button id="showUpload" class="btn btn-secondary">
                        <i class="fas fa-upload"></i> Upload Image
                    </button>
                </div>

                <!-- Camera Section -->
                <div id="cameraSection" class="camera-container" style="display: none;">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                    <div class="camera-controls">
                        <button id="capture" class="btn btn-primary">
                            <i class="fas fa-camera"></i> Capture & Detect
                        </button>
                        <button id="closeCamera" class="btn btn-danger">
                            <i class="fas fa-times"></i> Close Camera
                        </button>
                    </div>
                </div>

                <!-- Upload Section -->
                <div id="uploadSection" style="display: none;">
                    <div class="upload-area" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <p class="upload-text">Drag & drop your image here or click to browse</p>
                        <button class="btn btn-primary" id="uploadButton">
                            <i class="fas fa-folder-open"></i> Select Image
                        </button>
                        <input type="file" name="file" accept="image/*" class="file-input" id="fileInput">
                        <div id="fileName" class="file-name"></div>
                    </div>
                </div>
            </div>

            <div id="result"></div>
        </main>

        <footer>
            <p>EdgeVision AI &copy; 2023 | Advanced Edge Computing Platform</p>
        </footer>
    </div>

    <script>
        // DOM elements
        const showCameraBtn = document.getElementById('showCamera');
        const showUploadBtn = document.getElementById('showUpload');
        const cameraSection = document.getElementById('cameraSection');
        const uploadSection = document.getElementById('uploadSection');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureButton = document.getElementById('capture');
        const closeCameraBtn = document.getElementById('closeCamera');
        const context = canvas.getContext('2d');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const fileName = document.getElementById('fileName');

        let stream = null;

        // Show camera section
        showCameraBtn.addEventListener('click', async () => {
            showCameraBtn.classList.remove('pulse');
            uploadSection.style.display = 'none';
            cameraSection.style.display = 'block';

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                video.srcObject = stream;
            } catch (err) {
                console.error('Error accessing camera:', err);
                alert('Could not access camera. Please ensure camera permissions are granted.');
            }
        });

        // Show upload section
        showUploadBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            cameraSection.style.display = 'none';
            uploadSection.style.display = 'block';
        });

        // Upload button functionality
        uploadButton.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            fileInput.click();
        });

        // Upload area functionality
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file selection
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileName.textContent = this.files[0].name;
                uploadArea.classList.add('active');
                
                // Process the image immediately after selection
                handleFileUpload();
            }
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--primary)';
            uploadArea.style.background = 'rgba(99, 102, 241, 0.1)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            uploadArea.style.background = 'transparent';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'rgba(255, 255, 255, 0.15)';
            uploadArea.style.background = 'transparent';
            
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                fileName.textContent = fileInput.files[0].name;
                uploadArea.classList.add('active');
                handleFileUpload();
            }
        });

        function handleFileUpload() {
            if (!fileInput.files.length) return;
            
            const file = fileInput.files[0];
            if (!file.type.match('image.*')) {
                alert('Please select an image file');
                return;
            }

            const formData = new FormData();
            formData.append("file", file);
            processImage(formData);
        }

        // Close camera
        closeCameraBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            cameraSection.style.display = 'none';
        });

        // Capture photo
        captureButton.addEventListener('click', async () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'camera.jpg');

                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                cameraSection.style.display = 'none';

                processImage(formData);
            }, 'image/jpeg', 0.95);
        });

        // Process image function (used by both camera and upload)
        async function processImage(formData) {
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Processing image with AI detection engine...</p>
                </div>
            `;

            try {
                const startTime = performance.now();
                
                // Send the image to the server for processing
                const res = await fetch("/detect", {
                    method: "POST",
                    body: formData
                });
                
                if (!res.ok) {
                    throw new Error(`Server returned ${res.status}: ${res.statusText}`);
                }
                
                const data = await res.json();

                if (!data.success) {
                    throw new Error("Detection failed: " + (data.error || "Unknown error"));
                }

                const endTime = performance.now();
                const totalTime = (endTime - startTime) / 1000;

                // Format the detections for display
                const detectionsHTML = data.detections && data.detections.length > 0 
                    ? data.detections.map(detection => `
                        <div class="detection-item">
                            <span class="detection-name">${detection.class}</span>
                            <span class="detection-confidence">${(detection.confidence * 100).toFixed(1)}% confidence</span>
                        </div>
                    `).join('')
                    : `<div class="detection-item">
                        <span class="detection-name">No objects detected</span>
                       </div>`;

                resultDiv.innerHTML = `
                    <div class="result-container">
                        <div class="result-header">
                            <i class="fas fa-check-circle" style="color: var(--secondary); font-size: 2.5rem;"></i>
                            <h2 class="result-title">Detection Complete</h2>
                        </div>
                        
                        <div class="metrics-grid">
                            <div class="metric-card">
                                <i class="fas fa-upload" style="color: var(--primary); font-size: 2rem;"></i>
                                <div class="metric-value">${data.upload_time ? data.upload_time.toFixed(3) : '0.000'}s</div>
                                <div class="metric-label">Upload Time</div>
                            </div>
                            <div class="metric-card">
                                <i class="fas fa-clock" style="color: var(--primary); font-size: 2rem;"></i>
                                <div class="metric-value">${data.detection_time ? data.detection_time.toFixed(3) : '0.000'}s</div>
                                <div class="metric-label">Detection Time</div>
                            </div>
                            <div class="metric-card">
                                <i class="fas fa-server" style="color: var(--primary); font-size: 2rem;"></i>
                                <div class="metric-value">${data.total_server_time ? data.total_server_time.toFixed(3) : '0.000'}s</div>
                                <div class="metric-label">Server Processing</div>
                            </div>
                            <div class="metric-card">
                                <i class="fas fa-network-wired" style="color: var(--primary); font-size: 2rem;"></i>
                                <div class="metric-value">${(totalTime - (data.total_server_time || 0)).toFixed(3)}s</div>
                                <div class="metric-label">Network Overhead</div>
                            </div>
                        </div>
                        
                        <div class="image-container">
                            <img src="${data.image_url || 'https://placehold.co/600x400/4f46e5/white?text=Processed+Image'}" alt="Annotated Image">
                        </div>
                        
                        <h3 class="section-title"><i class="fas fa-object-group"></i> Detected Objects</h3>
                        <div class="detections">
                            ${detectionsHTML}
                        </div>
                    </div>
                `;

            } catch (err) {
                console.error('Error:', err);
                resultDiv.innerHTML = `
                    <div class="result-container">
                        <div class="result-header">
                            <i class="fas fa-exclamation-circle" style="color: #ef4444; font-size: 2.5rem;"></i>
                            <h2 class="result-title">Processing Error</h2>
                        </div>
                        <p>${err.message || 'There was an error processing your image. Please try again.'}</p>
                        <p>Check that your server is running and the /detect endpoint is available.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
